# RBAC configuration for Woodpecker CI to deploy paperless-webdav.
# Keep matching resources in barryw/infrastructure/kubernetes-default/paperless/resources.yaml.

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperless-webdav-deployer
  namespace: default
  labels:
    app.kubernetes.io/name: paperless-webdav-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["paperless-webdav"]
    verbs: ["get", "watch", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woodpecker-paperless-webdav-deployer
  namespace: default
  labels:
    app.kubernetes.io/name: woodpecker-paperless-webdav-deployer
subjects:
  - kind: ServiceAccount
    name: default
    namespace: woodpecker
roleRef:
  kind: Role
  name: paperless-webdav-deployer
  apiGroup: rbac.authorization.k8s.io
