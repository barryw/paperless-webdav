name: Publish multi-arch image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: paperless-webdav-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/barryw/paperless-webdav
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Woodpecker publishes the release before Kaniko publishes its amd64 image.
      - name: Wait for Woodpecker image
        run: |
          for attempt in {1..60}; do
            if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for Woodpecker image ($attempt/60)"
            sleep 10
          done
          echo "Woodpecker did not publish $IMAGE:$TAG" >&2
          exit 1

      - name: Set image creation time
        id: metadata
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and publish both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/barryw/paperless-webdav:${{ github.event.release.tag_name }}
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify image and update latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          manifest=$(docker buildx imagetools inspect --raw "$IMAGE:$TAG")
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $arch)' <<< "$manifest"
          done
          if [ "$(gh release view --json tagName -q .tagName)" = "$TAG" ]; then
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$TAG"
          fi
